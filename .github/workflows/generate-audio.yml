name: Generate Japanese course audio

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "scripts/generate_audio.py"
      - ".github/workflows/generate-audio.yml"

permissions:
  contents: write

jobs:
  generate-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Japanese TTS generator
        run: pip install edge-tts

      - name: Generate missing MP3 files
        run: python scripts/generate_audio.py

      - name: Commit generated audio
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain audio)" ]; then
            echo "No audio changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          git commit -m "Generate Japanese lesson audio"
          git pull --rebase origin main
          git push origin main
