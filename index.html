<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="./manifest.webmanifest">
<title>机械加工实用日语180天</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--muted:#64748b;--accent:#2563eb;--line:#e2e8f0;--ok:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:9;background:#0f172a;color:#fff;padding:14px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-weight:800;font-size:18px}.sub{font-size:12px;color:#cbd5e1;margin-top:3px}
main{max-width:820px;margin:auto;padding:14px 12px 90px}.nav{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:700}.nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.section-title{font-weight:800;font-size:17px;margin-bottom:10px}.word{display:grid;grid-template-columns:1fr auto;gap:10px;border-top:1px solid var(--line);padding:12px 0}.word:first-of-type{border-top:0}.jp{font-size:21px;font-weight:800}.kana{font-size:14px;color:#475569;margin-top:2px}.cn{font-size:14px;color:#334155;margin-top:4px}.play{border:0;border-radius:12px;background:#eff6ff;color:#1d4ed8;padding:9px 11px;font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.success{background:#ecfdf5;color:#166534;border-color:#bbf7d0}.note{font-size:13px;color:var(--muted);line-height:1.6}.sentence{padding:11px 0;border-top:1px dashed var(--line)}.sentence:first-of-type{border-top:0}.sentence .jp{font-size:18px}.hidden{display:none!important}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px 12px max(9px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:10}footer button{flex:1;max-width:240px;padding:11px;border-radius:12px;border:1px solid var(--line);font-weight:800}.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--ok)}.answer{margin-top:7px;color:#166534}.badge{font-size:12px;padding:4px 8px;border-radius:99px;background:#e0e7ff;color:#3730a3;font-weight:700}
</style></head>
<body>
<header><div class="top"><div><div class="title">机械加工实用日语 · 第1周</div><div class="sub">手机优先 · 发音 · 跟读 · 进度保存 · PWA</div></div><span id="voiceBadge" class="badge">检测语音中</span></div></header>
<main><div class="nav" id="dayNav"></div>
<div class="card"><div class="section-title">学习设置</div><div class="row"><button class="pill primary" id="normalBtn">正常语速 0.9×</button><button class="pill" id="slowBtn">慢速 0.65×</button><button class="pill" id="kanaBtn">隐藏假名</button><button class="pill" id="voiceBtn">重新检测语音</button></div><div class="note" id="voiceInfo">优先使用设备中的日语语音。</div></div>
<div id="content"></div></main>
<footer><button id="prev">← 前一天</button><button id="done" class="success">✓ 完成今天</button><button id="next">后一天 →</button></footer>
<script>
const DAYS=[
{d:1,title:'基础激活｜自我介绍 + 机械词',goal:'认读第一批机械词，能完成5句工作自我介绍。',words:[['加工','かこう','加工'],['機械','きかい','机械、机器'],['工具','こうぐ','工具'],['製品','せいひん','产品'],['材料','ざいりょう','材料'],['図面','ずめん','图纸'],['測定','そくてい','测量'],['確認','かくにん','确认'],['治具','じぐ','夹具、治具'],['旋盤','せんばん','车床']],grammar:[['これは〇〇です。','这是〇〇。'],['〇〇を〇〇します。','对某对象做某动作。']],sentences:[['私は周です。','わたし は しゅう です。','我姓周。'],['製造業で働いています。','せいぞうぎょう で はたらいています。','我在制造业工作。'],['機械加工の仕事をしています。','きかいかこう の しごと を しています。','我从事机械加工工作。'],['生産管理も担当しています。','せいさんかんり も たんとうしています。','我也负责生产管理。'],['この製品を加工します。','この せいひん を かこう します。','加工这个产品。']],quiz:[['“这是夹具”怎么说？','これは治具です。'],['“确认图纸”怎么说？','図面を確認します。']]},
{d:2,title:'片假名恢复｜刀具与夹持',goal:'掌握常见刀具外来语，能说使用/不使用某工具。',words:[['ドリル','ドリル','钻头'],['タップ','タップ','丝锥'],['チャック','チャック','卡盘'],['エンドミル','エンドミル','立铣刀'],['ホルダ','ホルダ','刀柄/刀夹'],['チップ','チップ','刀片'],['クランプ','クランプ','夹紧'],['パレット','パレット','托盘'],['ロボット','ロボット','机器人'],['プログラム','プログラム','程序']],grammar:[['使います。','使用。'],['使いません。','不使用。']],sentences:[['この工具を使います。','この こうぐ を つかいます。','使用这个工具。'],['このタップは使いません。','この タップ は つかいません。','不使用这个丝锥。'],['製品をチャックで固定します。','せいひん を チャック で こていします。','用卡盘固定产品。']],quiz:[['“钻头”日语是什么？','ドリル'],['“这个工具不使用”怎么说？','この工具は使いません。']]},
{d:3,title:'动作表达｜加工、测量、确认',goal:'用ます形表达车间常见动作。',words:[['加工する','かこうする','加工'],['測定する','そくていする','测量'],['確認する','かくにんする','确认'],['交換する','こうかんする','更换'],['取り付ける','とりつける','安装'],['取り外す','とりはずす','拆下'],['止める','とめる','停止'],['始める','はじめる','开始'],['動かす','うごかす','使其运动'],['検査する','けんさする','检查']],grammar:[['〇〇します。','做〇〇。'],['〇〇しました。','已经做了〇〇。']],sentences:[['寸法を測定します。','すんぽう を そくていします。','测量尺寸。'],['工具を交換します。','こうぐ を こうかんします。','更换刀具。'],['加工を始めます。','かこう を はじめます。','开始加工。']],quiz:[['“更换刀具”怎么说？','工具を交換します。'],['“已经测量了尺寸”怎么说？','寸法を測定しました。']]},
{d:4,title:'位置表达｜夹具与工件',goal:'描述工件、夹具、孔的位置关系。',words:[['上','うえ','上面'],['下','した','下面'],['右','みぎ','右边'],['左','ひだり','左边'],['前','まえ','前面'],['後ろ','うしろ','后面'],['中','なか','里面'],['外','そと','外面'],['位置','いち','位置'],['基準','きじゅん','基准']],grammar:[['〇〇の上です。','在〇〇上面。'],['〇〇の中にあります。','在〇〇里面。']],sentences:[['治具の上に製品があります。','じぐ の うえ に せいひん が あります。','夹具上有产品。'],['穴は右側にあります。','あな は みぎがわ に あります。','孔在右侧。'],['この面が基準です。','この めん が きじゅん です。','这个面是基准。']],quiz:[['“这个面是基准”怎么说？','この面が基準です。'],['“右边”是什么？','右（みぎ）']]},
{d:5,title:'数字与尺寸｜生产现场读数',goal:'能读常用数量、毫米尺寸和设备编号。',words:[['一個','いっこ','1个'],['十個','じゅっこ','10个'],['百個','ひゃっこ','100个'],['寸法','すんぽう','尺寸'],['直径','ちょっけい','直径'],['外径','がいけい','外径'],['内径','ないけい','内径'],['深さ','ふかさ','深度'],['幅','はば','宽度'],['ミリ','ミリ','毫米']],grammar:[['〇〇ミリです。','是〇〇毫米。'],['〇〇個です。','是〇〇个。']],sentences:[['外径は125ミリです。','がいけい は ひゃくにじゅうご ミリ です。','外径是125毫米。'],['今日の計画は200個です。','きょう の けいかく は にひゃっこ です。','今天计划200个。'],['深さは20ミリです。','ふかさ は にじゅう ミリ です。','深度是20毫米。']],quiz:[['“外径”日语是什么？','外径（がいけい）'],['“深度20毫米”怎么说？','深さは20ミリです。']]},
{d:6,title:'请求与确认｜现场指示',goal:'会说请确认、请不要操作、可以使用吗。',words:[['確認','かくにん','确认'],['使用','しよう','使用'],['安全','あんぜん','安全'],['停止','ていし','停止'],['注意','ちゅうい','注意'],['問題','もんだい','问题'],['大丈夫','だいじょうぶ','没问题/可以'],['もう一度','もういちど','再一次'],['お願いします','おねがいします','拜托了/请'],['待つ','まつ','等待']],grammar:[['〇〇してください。','请做〇〇。'],['〇〇しないでください。','请不要做〇〇。']],sentences:[['図面を確認してください。','ずめん を かくにんしてください。','请确认图纸。'],['機械を動かさないでください。','きかい を うごかさないでください。','请不要操作机器。'],['この工具を使用してもいいですか。','この こうぐ を しようしても いいですか。','可以使用这个工具吗？']],quiz:[['“请确认图纸”怎么说？','図面を確認してください。'],['“请不要操作机器”怎么说？','機械を動かさないでください。']]},
{d:7,title:'第1周复习｜车间基础会话',goal:'复习前6天，并完成1分钟工作介绍。',words:[['復習','ふくしゅう','复习'],['練習','れんしゅう','练习'],['会話','かいわ','会话'],['質問','しつもん','问题/提问'],['回答','かいとう','回答'],['作業','さぎょう','作业'],['担当','たんとう','负责'],['現場','げんば','现场'],['今日','きょう','今天'],['明日','あした','明天']],grammar:[['今週は〇〇を勉強しました。','本周学习了〇〇。'],['〇〇も担当しています。','也负责〇〇。']],sentences:[['機械加工の仕事をしています。','きかいかこう の しごと を しています。','我从事机械加工工作。'],['生産管理も担当しています。','せいさんかんり も たんとうしています。','我也负责生产管理。'],['図面を確認して、製品を加工します。','ずめん を かくにんして、せいひん を かこうします。','确认图纸后加工产品。'],['加工後、寸法を測定します。','かこうご、すんぽう を そくていします。','加工后测量尺寸。']],quiz:[['本周自我介绍第一句？','私は周です。'],['“加工后测量尺寸”怎么说？','加工後、寸法を測定します。'],['“我也负责生产管理”怎么说？','生産管理も担当しています。']]}
];
let day=+(localStorage.getItem('jc_day')||1),rate=+(localStorage.getItem('jc_rate')||0.9),hideKana=localStorage.getItem('jc_hideKana')==='1',jaVoices=[];
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function detectVoices(){if(!('speechSynthesis'in window)){voiceBadge.textContent='浏览器无语音';return}jaVoices=speechSynthesis.getVoices().filter(v=>/^ja(-|_)/i.test(v.lang)||/Japanese|日本語/i.test(v.name));voiceBadge.textContent=jaVoices.length?'日语语音 ✓':'未发现日语语音';voiceInfo.textContent=jaVoices.length?('当前：'+jaVoices[0].name+'。点击“▶ 发音”即可播放。'):'当前设备没有暴露日语语音。iPhone/iPad 请优先用 Safari，Android 请优先用 Chrome，并在系统中安装日语文字转语音。'}
function speak(t){if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音合成');return}const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=rate;if(jaVoices[0])u.voice=jaVoices[0];speechSynthesis.cancel();speechSynthesis.speak(u)}
function render(){const x=DAYS[day-1],completed=JSON.parse(localStorage.getItem('jc_done')||'[]');dayNav.innerHTML=DAYS.map(v=>'<button class="'+(v.d===day?'active':'')+'" onclick="setDay('+v.d+')">Day '+v.d+'</button>').join('');let h='<div class="card"><div class="section-title">Day '+x.d+'｜'+x.title+'</div><div class="note"><b>今日目标：</b>'+x.goal+'</div><div style="margin-top:12px" class="progress"><div class="bar" style="width:'+(completed.length/7*100)+'%"></div></div><div class="note" style="margin-top:6px">第1周完成 '+completed.length+'/7 天</div></div>';
h+='<div class="card"><div class="section-title">① 今日词汇</div>'+x.words.map(w=>'<div class="word"><div><div class="jp">'+esc(w[0])+'</div><div class="kana '+(hideKana?'hidden':'')+'">'+esc(w[1])+'</div><div class="cn">'+esc(w[2])+'</div></div><button class="play" onclick='+JSON.stringify('speak('+JSON.stringify(w[0])+')')+'>▶ 发音</button></div>').join('')+'</div>';
h+='<div class="card"><div class="section-title">② 今日语法</div>'+x.grammar.map(g=>'<div class="sentence"><div class="jp">'+esc(g[0])+'</div><div class="cn">'+esc(g[1])+'</div><button class="play" onclick='+JSON.stringify('speak('+JSON.stringify(g[0])+')')+'>▶ 听句型</button></div>').join('')+'</div>';
h+='<div class="card"><div class="section-title">③ 工作场景句</div>'+x.sentences.map(s=>'<div class="sentence"><div class="jp">'+esc(s[0])+'</div><div class="kana '+(hideKana?'hidden':'')+'">'+esc(s[1])+'</div><div class="cn">'+esc(s[2])+'</div><div class="row" style="margin-top:7px"><button class="play" onclick='+JSON.stringify('speak('+JSON.stringify(s[0])+')')+'>▶ 发音</button></div></div>').join('')+'</div>';
h+='<div class="card"><div class="section-title">④ 今日小测</div>'+x.quiz.map((q,i)=>'<div class="sentence"><b>'+(i+1)+'. '+esc(q[0])+'</b><br><button class="pill" onclick="this.nextElementSibling.classList.toggle(\'hidden\')">查看答案</button><div class="answer hidden">'+esc(q[1])+'</div></div>').join('')+'</div>';
content.innerHTML=h;normalBtn.classList.toggle('primary',rate===.9);slowBtn.classList.toggle('primary',rate===.65);kanaBtn.textContent=hideKana?'显示假名':'隐藏假名';done.textContent=completed.includes(day)?'✓ 今天已完成':'✓ 完成今天';localStorage.setItem('jc_day',day)}
function setDay(n){day=Math.min(7,Math.max(1,n));render();scrollTo({top:0,behavior:'smooth'})}
normalBtn.onclick=()=>{rate=.9;localStorage.setItem('jc_rate',rate);render()};slowBtn.onclick=()=>{rate=.65;localStorage.setItem('jc_rate',rate);render()};kanaBtn.onclick=()=>{hideKana=!hideKana;localStorage.setItem('jc_hideKana',hideKana?'1':'0');render()};voiceBtn.onclick=detectVoices;prev.onclick=()=>setDay(day-1);next.onclick=()=>setDay(day+1);done.onclick=()=>{let a=JSON.parse(localStorage.getItem('jc_done')||'[]');if(!a.includes(day))a.push(day);localStorage.setItem('jc_done',JSON.stringify(a));render()};
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=detectVoices;setTimeout(detectVoices,300);setTimeout(detectVoices,1500)}if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
