function gradeItem(type,d,text,grade){
  const k=itemKey(type,d,text),m=getMastery(),now=new Date().toISOString();
  const prev=m[k]||{seen:0,correct:0,score:0};

  prev.score=grade;
  prev.last=now;
  m[k]=prev;setMastery(m);updateReviewCounts();

function masteryWeight(it){
  const m=getMastery()[itemKey(it.type,it.day,it.text)];
  if(!m)return 3;
  if(m.score===0)return 8;
  if(m.score===1)return 5;
  return 1;

function weightedRandom(items,n){
  const pool=[];
  items.forEach(it=>{for(let i=0;i<masteryWeight(it);i++)pool.push(it)});
  const out=[],used=new Set();
  while(pool.length&&out.length<n){
    const it=pool[Math.floor(Math.random()*pool.length)];
    const k=itemKey(it.type,it.day,it.text);
    if(!used.has(k)){used.add(k);out.push(it)}
  }
  return out;
}

function dayDiff(iso){
  const a=new Date(iso);const b=new Date();
  return Math.floor((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);

function collectAllItems(filterFn){
  const out=[];
  DAYS.forEach(x=>{
    x.words.forEach(w=>out.push({type:'word',day:x.d,text:w[0],kana:w[1],cn:w[2]}));
    x.sentences.forEach(s=>out.push({type:'sentence',day:x.d,text:s[0],kana:s[1],cn:s[2]}));

  });

async function speak(t){
  try{
    if(audioMap[t]){
      if(audioPlayer){audioPlayer.pause();audioPlayer=null}
      if('speechSynthesis' in window) speechSynthesis.cancel();
      audioPlayer=new Audio('./'+audioMap[t]);
      audioPlayer.playbackRate = rate===.65 ? 0.75 : 1.0;
      await audioPlayer.play();
      return;
    }
  }catch(e){console.warn('Static audio playback failed',e)}
  if(!('speechSynthesis'in window)){alert('这条音频尚未生成，且当前浏览器没有日语系统语音。');return}
  const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=rate;if(jaVoices[0])u.voice=jaVoices[0];speechSynthesis.cancel();speechSynthesis.speak(u)
}
function playStatic(text,playbackRate){
  return new Promise((resolve,reject)=>{
    const p=audioMap[text];
    if(!p){reject(new Error('missing audio'));return}
    if(audioPlayer){audioPlayer.pause();audioPlayer=null}
    const a=new Audio('./'+p);
    audioPlayer=a;
    a.playbackRate=playbackRate||1;
    a.onended=()=>resolve();
    a.onerror=()=>reject(new Error('audio error'));
    a.play().catch(reject);
  });
}
async function playToday(shadow=false){

  for(let i=0;i<x.sentences.length;i++){
    const text=x.sentences[i][0];
    items.forEach(el=>el.classList.remove('active-shadow'));
    if(shadow && items[i]) items[i].classList.add('active-shadow');
    voiceInfo.textContent=(shadow?'跟读 ':'连续播放 ')+(i+1)+'/'+x.sentences.length+'：'+text;
    try{await playStatic(text,rate===.65?0.75:1)}catch(e){await new Promise(r=>setTimeout(r,500))}

  items.forEach(el=>el.classList.remove('active-shadow'));
  document.body.classList.remove('shadowing');

}

const totalMonths=Math.ceil(DAYS.length/30);
openMonth=Math.min(totalMonths,Math.max(1,openMonth||Math.ceil(day/30)));
monthTabs.innerHTML=Array.from({length:totalMonths},(_,i)=>{
  const m=i+1,start=i*30+1,end=Math.min((i+1)*30,DAYS.length);
  const doneCount=completed.filter(d=>d>=start&&d<=end).length;
  return '<button class="'+(m===openMonth?'active':'')+'" data-month="'+m+'">第'+m+'月 <span class="mini">'+doneCount+'/'+(end-start+1)+'</span></button>';
}).join('');
const start=(openMonth-1)*30+1,end=Math.min(openMonth*30,DAYS.length);
dayNav.innerHTML=DAYS.filter(v=>v.d>=start&&v.d<=end).map(v=>'<button class="'+(v.d===day?'active ':'')+(completed.includes(v.d)?'done-day':'')+'" data-day="'+v.d+'">'+(completed.includes(v.d)?'✓ ':'')+'D'+v.d+'</button>').join('');
const mdone=completed.filter(d=>d>=start&&d<=end).length;
monthProgress.textContent='第'+openMonth+'月：完成 '+mdone+'/'+(end-start+1)+' 天';
let h='<div class="card"><div class="section-title">Day '+x.d+'｜'+x.title+'</div><div class="note"><b>今日目标：</b>'+x.goal+'</div><div class="quick-actions"><button class="pill primary" id="playTodayInline">▶ 连续听今日句子</button><button class="pill" id="shadowInline">🎧 跟读模式</button></div><div style="margin-top:12px" class="progress"><div class="bar" style="width:'+(completed.length/DAYS.length*100)+'%"></div></div><div class="note" style="margin-top:6px">总进度 '+completed.length+'/'+DAYS.length+' 天</div></div>';
h+='<div class="card"><div class="section-title">① 今日词汇</div>'+x.words.map(w=>'<div class="word"><div><div class="jp">'+esc(w[0])+'</div><div class="kana '+(hideKana?'hidden':'')+'">'+esc(w[1])+'</div><div class="cn">'+esc(w[2])+'</div></div><div class="row">'+sayButton('▶ 发音',w[0])+starButton('word',x.d,w[0])+'</div></div>').join('')+'</div>';
h+='<div class="card"><div class="section-title">② 今日语法</div>'+x.grammar.map(g=>'<div class="sentence"><div class="jp">'+esc(g[0])+'</div><div class="cn">'+esc(g[1])+'</div>'+sayButton('▶ 听句型',g[0])+'</div>').join('')+'</div>';
h+='<div class="card"><div class="section-title">③ 工作场景句</div>'+x.sentences.map(s=>'<div class="sentence"><div class="jp">'+esc(s[0])+'</div><div class="kana '+(hideKana?'hidden':'')+'">'+esc(s[1])+'</div><div class="cn">'+esc(s[2])+'</div><div class="row" style="margin-top:7px">'+sayButton('▶ 发音',s[0])+starButton('sentence',x.d,s[0])+'</div></div>').join('')+'</div>';
h+='<div class="card"><div class="section-title">④ 今日小测</div>'+x.quiz.map((q,i)=>'<div class="sentence"><b>'+(i+1)+'. '+esc(q[0])+'</b><br><button class="pill" onclick="this.nextElementSibling.classList.toggle(\'hidden\')">查看答案</button><div class="answer hidden">'+esc(q[1])+'</div></div>').join('')+'</div>';
content.innerHTML=h;
content.querySelectorAll('.cn').forEach(el=>el.classList.toggle('hidden-cn',hideCn));
normalBtn.classList.toggle('primary',rate===.9);slowBtn.classList.toggle('primary',rate===.65);
kanaBtn.textContent=hideKana?'显示假名':'隐藏假名';
cnBtn.textContent=hideCn?'显示中文':'隐藏中文';
done.textContent=completed.includes(day)?'✓ 今天已完成':'✓ 完成今天';
const p1=document.getElementById('playTodayInline'),p2=document.getElementById('shadowInline');
if(p1)p1.onclick=()=>playToday(false);if(p2)p2.onclick=()=>playToday(true);
localStorage.setItem('jc_day',day);localStorage.setItem('jc_month',openMonth)}
function setDay(n){day=Math.min(DAYS.length,Math.max(1,n));openMonth=Math.ceil(day/30);render();scrollTo({top:0,behavior:'smooth'})}
monthTabs.addEventListener('click',e=>{const b=e.target.closest('[data-month]');if(!b)return;openMonth=+b.dataset.month;localStorage.setItem('jc_month',openMonth);render()});
dayNav.addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b)return;setDay(+b.dataset.day)});
function commonClick(e){
  const b=e.target.closest('.audio-btn');
  if(b){const t=decodeURIComponent(b.dataset.say||'');if(t)speak(t);return}
  const s=e.target.closest('[data-fav-type]');
  if(s){toggleFav(s.dataset.favType,+s.dataset.favDay,decodeURIComponent(s.dataset.favText||''));return}
  const a=e.target.closest('[data-show-answer]');
  if(a){const el=document.getElementById('ra'+a.dataset.showAnswer);if(el)el.classList.toggle('hidden');return}
  const g=e.target.closest('[data-grade]');
  if(g){
    const it=reviewItems[+g.dataset.gradeIndex];
    if(it){gradeItem(it.type,it.day,it.text,+g.dataset.grade);g.closest('.review-card')?.classList.add('graded')}
  }
}
content.addEventListener('click',commonClick);
reviewPanel.addEventListener('click',commonClick);
normalBtn.onclick=()=>{rate=.9;localStorage.setItem('jc_rate',rate);render()};slowBtn.onclick=()=>{rate=.65;localStorage.setItem('jc_rate',rate);render()};kanaBtn.onclick=()=>{hideKana=!hideKana;localStorage.setItem('jc_hideKana',hideKana?'1':'0');render()};cnBtn.onclick=()=>{hideCn=!hideCn;localStorage.setItem('jc_hideCn',hideCn?'1':'0');render()};voiceBtn.onclick=detectVoices;jumpBtn.onclick=()=>{const completed=JSON.parse(localStorage.getItem('jc_done')||'[]');const next=DAYS.find(v=>!completed.includes(v.d));if(next)setDay(next.d)};
dueReviewBtn.onclick=()=>renderReview(dueItems(),'今日到期复习');
randomReviewBtn.onclick=()=>renderReview(weightedRandom(collectAllItems(),10),'智能随机10题');
favReviewBtn.onclick=()=>renderReview(favoriteItems(),'重点收藏');
clearReviewBtn.onclick=()=>{reviewPanel.innerHTML='';reviewItems=[]};
audioTestBtn.onclick=async()=>{
  voiceInfo.textContent='正在测试“加工”的内置MP3…';
  try{
    const p=audioMap['加工'];
    if(!p) throw new Error('audio-index 中没有“加工”');
    const a=new Audio('./'+p+'?v=3');
    a.playbackRate=1;
    a.onplaying=()=>{voiceBadge.textContent='内置音频正在播放 ✓';voiceInfo.textContent='测试成功：正在播放“加工”的内置MP3。'};
    a.onerror=()=>{voiceBadge.textContent='内置音频加载失败';voiceInfo.textContent='MP3加载失败，请刷新页面后重试。';};
    await a.play();
  }catch(e){
    voiceBadge.textContent='播放失败';
    voiceInfo.textContent='测试失败：'+(e?.message||e);
  }
};
prev.onclick=()=>setDay(day-1);next.onclick=()=>setDay(day+1);done.onclick=()=>{let a=JSON.parse(localStorage.getItem('jc_done')||'[]');if(!a.includes(day))a.push(day);localStorage.setItem('jc_done',JSON.stringify(a));markStudied(day);render();updateReviewCounts()};
fetch('./audio/audio-index.json?v=8',{cache:'no-store'})
.then(r=>r.ok?r.json():Promise.reject(new Error('HTTP '+r.status)))
.then(m=>{
  audioMap=m||{};
  const p=audioMap['加工'];
  audioDiagText.textContent='已加载内置音频：'+Object.keys(audioMap).length+' 条'+(p?'；“加工”音频已找到。':'；未找到“加工”音频。');
  if(p) nativeAudioTest.src='./'+p+'?v=8';
  detectVoices();
})
.catch(e=>{
  audioDiagText.textContent='音频索引加载失败：'+e.message;
  detectVoices();
});
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=detectVoices;setTimeout(detectVoices,300);setTimeout(detectVoices,1500)}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();updateReviewCounts();
</script></body></html>
