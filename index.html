    voiceBadge.textContent='内置日语音频 ✓';
    voiceInfo.textContent='优先播放网站内置标准日语音频；系统日语语音仅作为备用。';
  }else if(jaVoices.length){
    voiceBadge.textContent='系统日语语音 ✓';
    voiceInfo.textContent='内置音频正在准备；当前先使用 '+jaVoices[0].name+'。';
  }else{
    voiceBadge.textContent='音频准备中';
    voiceInfo.textContent='内置日语音频正在生成。生成完成后，华为浏览器也无需系统日语语音即可播放。';
  }
}
async function speak(t){
  try{
    if(audioMap[t]){
      if(audioPlayer){audioPlayer.pause();audioPlayer=null}
      if('speechSynthesis' in window) speechSynthesis.cancel();
      audioPlayer=new Audio('./'+audioMap[t]);
      audioPlayer.playbackRate = rate===.65 ? 0.75 : 1.0;
      await audioPlayer.play();
      return;
    }
  }catch(e){console.warn('Static audio playback failed',e)}
  if(!('speechSynthesis'in window)){alert('这条音频尚未生成，且当前浏览器没有日语系统语音。');return}
  const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=rate;if(jaVoices[0])u.voice=jaVoices[0];speechSynthesis.cancel();speechSynthesis.speak(u)
}
function render(){const x=DAYS[day-1],completed=JSON.parse(localStorage.getItem('jc_done')||'[]');dayNav.innerHTML=DAYS.map(v=>'<button class="'+(v.d===day?'active':'')+'" onclick="setDay('+v.d+')">Day '+v.d+'</button>').join('');let h='<div class="card"><div class="section-title">Day '+x.d+'｜'+x.title+'</div><div class="note"><b>今日目标：</b>'+x.goal+'</div><div style="margin-top:12px" class="progress"><div class="bar" style="width:'+(completed.length/30*100)+'%"></div></div><div class="note" style="margin-top:6px">第1个月完成 '+completed.length+'/30 天</div></div>';
h+='<div class="card"><div class="section-title">① 今日词汇</div>'+x.words.map(w=>'<div class="word"><div><div class="jp">'+esc(w[0])+'</div><div class="kana '+(hideKana?'hidden':'')+'">'+esc(w[1])+'</div><div class="cn">'+esc(w[2])+'</div></div><button class="play" onclick='+JSON.stringify('speak('+JSON.stringify(w[0])+')')+'>▶ 发音</button></div>').join('')+'</div>';
h+='<div class="card"><div class="section-title">② 今日语法</div>'+x.grammar.map(g=>'<div class="sentence"><div class="jp">'+esc(g[0])+'</div><div class="cn">'+esc(g[1])+'</div><button class="play" onclick='+JSON.stringify('speak('+JSON.stringify(g[0])+')')+'>▶ 听句型</button></div>').join('')+'</div>';
h+='<div class="card"><div class="section-title">③ 工作场景句</div>'+x.sentences.map(s=>'<div class="sentence"><div class="jp">'+esc(s[0])+'</div><div class="kana '+(hideKana?'hidden':'')+'">'+esc(s[1])+'</div><div class="cn">'+esc(s[2])+'</div><div class="row" style="margin-top:7px"><button class="play" onclick='+JSON.stringify('speak('+JSON.stringify(s[0])+')')+'>▶ 发音</button></div></div>').join('')+'</div>';
h+='<div class="card"><div class="section-title">④ 今日小测</div>'+x.quiz.map((q,i)=>'<div class="sentence"><b>'+(i+1)+'. '+esc(q[0])+'</b><br><button class="pill" onclick="this.nextElementSibling.classList.toggle(\'hidden\')">查看答案</button><div class="answer hidden">'+esc(q[1])+'</div></div>').join('')+'</div>';
content.innerHTML=h;normalBtn.classList.toggle('primary',rate===.9);slowBtn.classList.toggle('primary',rate===.65);kanaBtn.textContent=hideKana?'显示假名':'隐藏假名';done.textContent=completed.includes(day)?'✓ 今天已完成':'✓ 完成今天';localStorage.setItem('jc_day',day)}
function setDay(n){day=Math.min(30,Math.max(1,n));render();scrollTo({top:0,behavior:'smooth'})}
normalBtn.onclick=()=>{rate=.9;localStorage.setItem('jc_rate',rate);render()};slowBtn.onclick=()=>{rate=.65;localStorage.setItem('jc_rate',rate);render()};kanaBtn.onclick=()=>{hideKana=!hideKana;localStorage.setItem('jc_hideKana',hideKana?'1':'0');render()};voiceBtn.onclick=detectVoices;
audioTestBtn.onclick=async()=>{
  voiceInfo.textContent='正在测试“加工”的内置MP3…';
  try{
    const p=audioMap['加工'];
    if(!p) throw new Error('audio-index 中没有“加工”');
    const a=new Audio('./'+p+'?v=3');
    a.playbackRate=1;
    a.onplaying=()=>{voiceBadge.textContent='内置音频正在播放 ✓';voiceInfo.textContent='测试成功：正在播放“加工”的内置MP3。'};
    a.onerror=()=>{voiceBadge.textContent='内置音频加载失败';voiceInfo.textContent='MP3加载失败，请刷新页面后重试。';};
    await a.play();
  }catch(e){
    voiceBadge.textContent='播放失败';
    voiceInfo.textContent='测试失败：'+(e?.message||e);
  }
};
prev.onclick=()=>setDay(day-1);next.onclick=()=>setDay(day+1);done.onclick=()=>{let a=JSON.parse(localStorage.getItem('jc_done')||'[]');if(!a.includes(day))a.push(day);localStorage.setItem('jc_done',JSON.stringify(a));render()};
fetch('./audio/audio-index.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).then(m=>{audioMap=m||{};detectVoices()}).catch(()=>detectVoices());
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=detectVoices;setTimeout(detectVoices,300);setTimeout(detectVoices,1500)}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
